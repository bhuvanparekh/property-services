<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a3558'/%3E%3Ctext y='22' x='16' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-weight='800' font-size='14' fill='white'%3EPS%3C/text%3E%3C/svg%3E">
  <title>Request Detail — Property Services</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <a href="dashboard.html" class="logo-link">
          <div class="logo-icon">PS</div>
          <div class="logo-text">PROPERTY SERVICES</div>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="my-properties.html"><span class="nav-icon">🏗️</span> My Properties</a>
        <a href="service-apply.html"><span class="nav-icon">📋</span> Apply for Service</a>
        <a href="my-requests.html" class="active"><span class="nav-icon">📊</span> My Requests</a>
      </nav>
      <button class="logout-btn" onclick="logout()"><span>🚪</span> Logout</button>
    </aside>
    <main class="main-content">
      <div class="content-header">
        <div style="display:flex;align-items:center;gap:12px;">
          <a href="my-requests.html" style="color:#1e3a5f;font-size:20px;">&#8592;</a>
          <h1>Request Detail</h1>
        </div>
        <div class="user-chip"><div class="avatar" id="av">?</div></div>
      </div>
      <div class="content-body" id="content">
        <div style="text-align:center;padding:60px;color:#aaa;">Loading...</div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script>
    const user = getCurrentUser();
    if (!user || user.role === 'admin') window.location.href = 'auth.html';
    document.getElementById('av').textContent = initials(user.name || user.email);

    const params = new URLSearchParams(window.location.search);
    const reqId = parseInt(params.get('id'));
    const r = getServiceRequestById(reqId);

    if (!r || r.userId !== user.id) {
      document.getElementById('content').innerHTML = '<p style="color:#888;padding:40px;">Request not found.</p>';
    } else {
      const prop = getPropertyById(r.propertyId);
      const steps = ['requested','started','in_progress','completed'];
      const stepLabels = { requested:'Requested', started:'Started', in_progress:'In Progress', completed:'Completed' };
      const stepIcons = { requested:'📩', started:'🔍', in_progress:'⚙️', completed:'✅' };
      const currentIdx = steps.indexOf(r.status);
      const fillPct = currentIdx === 0 ? 0 : (currentIdx / (steps.length - 1)) * 100;

      const stepsHtml = steps.map((s, i) => {
        const cls = i < currentIdx ? 'done' : (i === currentIdx ? 'active' : '');
        const histEntry = r.statusHistory.find(h => h.status === s);
        return `<div class="tracker-step">
          <div class="step-circle ${cls}">${stepIcons[s]}</div>
          <div class="step-label ${cls}">${stepLabels[s]}</div>
          <div class="step-date">${histEntry ? formatDate(histEntry.date) : ''}</div>
        </div>`;
      }).join('');

      const histHtml = [...r.statusHistory].reverse().map(h => `
        <div class="history-item">
          <h5>${stepLabels[h.status] || h.status}</h5>
          ${h.note ? `<p>${h.note}</p>` : ''}
          <span class="h-date">${formatDate(h.date)}</span>
        </div>`).join('');

      document.getElementById('content').innerHTML = `
        <div style="max-width:750px;">
          <div class="form-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:20px;">
              <div>
                <h2 style="font-size:22px;color:#1e3a5f;margin-bottom:4px;">${r.serviceType}</h2>
                <p style="font-size:13px;color:#aaa;">Ref #PS-${String(r.id).padStart(4,'0')} &bull; ${prop ? prop.name : '—'} &bull; Applied ${formatDate(r.appliedAt)}</p>
              </div>
              ${statusBadge(r.status)}
            </div>

            <h4 style="font-size:13px;color:#1e3a5f;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">Progress</h4>
            <div class="progress-tracker" style="position:relative;margin-bottom:28px;">
              <div class="tracker-line-bg"></div>
              <div class="tracker-line-fill" style="width:calc(${fillPct * 0.8}%)"></div>
              ${stepsHtml}
            </div>

            <h4 style="font-size:13px;color:#1e3a5f;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">Status History</h4>
            <div class="history-list" style="margin-bottom:0;">${histHtml}</div>
          </div>

          ${r.documents && r.documents.length ? `
          <div class="form-card">
            <h3>Documents Submitted</h3>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              ${r.documents.map(d => `<span style="background:#f0f4ff;padding:5px 12px;border-radius:4px;font-size:13px;color:#1e3a5f;">✓ ${d}</span>`).join('')}
            </div>
          </div>` : ''}
        </div>`;
    }
  </script>
</body>
</html>
